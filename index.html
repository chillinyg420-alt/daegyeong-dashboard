<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>대경지역 매출자료 대시보드</title>
<style>
:root{--navy:#1f3864;--blue:#2f75b5;--cy:#2f75b5;--py:#a6a6a6;--bg:#f4f6fa;--card:#fff;--line:#dfe4ee;--pos:#1a6fc4;--neg:#d93025;--txt:#1d2433;--mut:#6b7385;--yel:#fff2cc;--grn:#e2efda}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header .sub{font-size:12px;opacity:.8}
.ctrl{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.lbl{font-size:12px;color:var(--mut);min-width:34px}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pill{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--txt)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.pill.ytd{border-color:var(--blue)}
.pill.bs.on{background:var(--blue);border-color:var(--blue)}
select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:#fff;min-width:180px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:6px}
.tab{padding:9px 16px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap;font-weight:600}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
main{padding:12px;max-width:1280px;margin:0 auto}
.note{font-size:12px;color:var(--mut);margin:6px 2px}
.banner{background:var(--yel);border:1px solid #f0d98a;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .t{font-size:12px;color:var(--mut)}.card .v{font-size:22px;font-weight:700;color:var(--navy);margin:2px 0}
.card .s{font-size:12px;color:var(--mut)}.card.big{grid-column:span 2;background:linear-gradient(135deg,#1f3864,#2f75b5);color:#fff}
.card.big .t,.card.big .s{color:#dbe7f7}.card.big .v{color:#fff;font-size:28px}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}
.card.big .pos,.card.big .neg{color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-bottom:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--navy);color:#fff;padding:7px 8px;position:sticky;top:0;white-space:nowrap;font-weight:600;cursor:default}
table.t th.sort{cursor:pointer}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td.cyc{background:#eaf2fb}table.t td.pyc{background:#f0f0f0;color:#555}
table.t tr.l0 td{background:var(--grn);font-weight:700;color:var(--navy)}
table.t tr.l1 td{font-weight:600;cursor:pointer}
table.t tr.l2 td{color:#444}table.t tr.l2 td:first-child{padding-left:28px}
table.t tr.l1 td:first-child{padding-left:16px}
table.t tr.tot td{background:var(--grn);font-weight:700;color:var(--navy)}
table.t tr.me td{outline:2px solid var(--blue);outline-offset:-2px}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:#f2f7ff}
.bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}.card.big{grid-column:span 1}}
#gate{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center}
#gate h2{margin:0 0 6px;color:var(--navy)}#gate p{color:var(--mut);font-size:13px}
#gate input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin:10px 0}
#gate button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:15px;cursor:pointer}
#err{color:var(--neg);font-size:13px;min-height:18px}
svg text{font-family:inherit}
</style>
</head>
<body>
<div id="gate"><h2>🔒 대경지역 매출자료</h2><p>접속 암호를 입력하세요.<br>(자료는 암호로 잠겨 있어 암호 없이는 볼 수 없습니다)</p><input id="pw" type="password" placeholder="암호" autocomplete="current-password"><button id="go">열기</button><div id="err"></div></div>
<div id="app" style="display:none">
<header><h1>📊 대경지역 매출자료 대시보드</h1><span class="sub" id="asof"></span></header>
<div class="ctrl">
 <div class="row"><span class="lbl">기준</span><div class="pills" id="basis"></div><span class="note" style="margin:0">합계 = 매장매출 + 재고통합</span></div>
 <div class="row"><span class="lbl">구분</span><div class="pills" id="periods"></div></div>
 <div class="row"><span class="lbl">대상</span><select id="group"></select><span class="note" id="gnote" style="margin:0"></span></div>
 <div class="tabs" id="tabs"></div>
</div>
<main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>
